<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="name UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>Form Exercise</title>
</head>
<body>
    <header>
        <h1>WDD 130 HTML Form-User Poll</h1>
    </header>
    <main>
        <form>
            <label for="fullname">Full Name: <input type="text" id="fullname" name="fullname" required placeholder="e.g John Okon"></label>
            <label for="useremail">Email: <input type=email id="useremail" name="useremail" required placeholder="e.g david@gmail.com"></label>

            <label for="userbrowser">What is your favorite browser?</label>
            <select id="browser" name="browser">
                <option value="1">Choose One</option>
                <option value="2">Safari</option>
                <option value="3">Chrome</option>
                <option value="4">Microsoft Edge</option>
                <option value="5">Avast Secure  Browser</option>
            </select>

            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">

            <label for="feedback">List the place that you lived?</label>
            <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdan Netherlands, Timbuktu Mali"></textarea>

            <button type="submit">Submit Poll</button>

            <div class="form-item">
                <label for="fullname">Fullname:</label>
                <input type="text" id="fullname" name="fullname">
            </div>

            <div class="form-item column1">
                <label for="fullname">Fullname:</label>
                <input type="text" id="fullname" name="fullname">
            </div>
            <div class="for-item column2">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail">
            </div>
        </form>
    </main>
    <footer>
       <p>© 2026 | Forms</p>
    </footer>
</body>
</html>
