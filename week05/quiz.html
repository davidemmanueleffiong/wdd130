<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-with, initial-scale=1.0">
    <title>Html And Css Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <label for="q1"><span class="number">1.</span> What does the acronym CSS stands for?</label>
            <input type="text" id="q1" name="q1">

            <label for="q2"><span class="number">2.</span> How are id and class attributes selected in CSS?</label>
            <textarea type="text" id="q2" name="q2"></textarea>

            <label for="q3"><span class="number">3.</span> Which of the following is a valid flex-box declaration?</label>
            <select type="option" id="q3" name="q3">
                <option value="" selected disabled>Choose One...</option>
                <option value="1">padding</option>
                <option value="2">Justify-content</option>
                <option value="3">grid-template-column</option>
            </select>
            <div class="form-group">
                <label for="q4"><span class="number">4.</span> What is the bottom margin given this declaration</label>
                <pre class="integer-number">margin: 10px 5px 15px;</pre>
                <input type="number" id="q4" name="q4">
            </div>
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
    <footer>
        <p>© 2026 | quiz</p>
    </footer>
</body>
</html>
